services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: mysql+pymysql://taskuser:taskpass@db:3306/tasks
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tasks
      MYSQL_USER: taskuser
      MYSQL_PASSWORD: taskpass
      MYSQL_ROOT_PASSWORD: localrootpass
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocalrootpass"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  mysql_data:
